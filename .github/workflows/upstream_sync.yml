name: Upstream Sync & Structural Drift Detection

on:
  schedule:
    # Run every Sunday at midnight (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-upstream-drift:
    name: Inspect Playwright Upstream & Detect Drift
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System and Testing Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-asyncio pyee typing-extensions
          pip install -e .

      - name: Inspect Upstream PyPI Release Metadata
        id: pypi-check
        run: |
          python -c "
          import urllib.request, json
          req = urllib.request.Request('https://pypi.org/pypi/playwright/json', headers={'User-Agent': 'termux-playwright-ci'})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode('utf-8'))
              latest_version = data['info']['version']
              print(f'Latest upstream Playwright version on PyPI: {latest_version}')
          "

      - name: Run Full Test Suite (66 Unit & Integration Tests)
        run: |
          pytest tests/ -v

      - name: Forensic Inspection of Driver Bundle Structure
        if: matrix.python-version == '3.12'
        run: |
          python -c "
          import os, sys, importlib.util
          from termux_playwright.patcher import locate_core_bundle_path, is_core_bundle_patched
          print('== Running Structural Integrity Check ==')
          try:
              bundle_path = locate_core_bundle_path()
              print(f'✅ Found driver bundle at: {bundle_path}')
          except Exception as err:
              print(f'❌ STRUCTURAL DRIFT DETECTED: {err}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Report Drift on Failure
        if: failure() && matrix.python-version == '3.12' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [Alert] Playwright Upstream Drift or Compatibility Break Detected" \
            --body "The scheduled weekly CI job detected a structural drift or failing tests against the latest upstream Playwright release. Please audit \`locate_core_bundle_path()\` and driver bundle layouts." \
            --label "bug" || true
